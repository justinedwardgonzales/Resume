<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>iPhone Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css?v=spotify-owner-controls-20261111">
</head>
<body>
  <main class="stage">
    <div class="phone" id="phone" aria-label="Interactive iPhone resume">
      <div class="screen">
        <div class="wallpaper" aria-hidden="true"></div>
        <div class="dynamic-island" aria-hidden="true"><span class="camera-dot"></span></div>

        <section id="lockScreen" class="lock-screen">
          <div class="ios-status-bar">
            <span id="statusTime">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>

          <div class="lock-content">
            <div class="lock-date" id="lockDate">Monday, November 7</div>
            <div class="lock-clock" id="lockClock">9:41</div>
          </div>

          <div class="lock-widgets" aria-label="Lock Screen widgets">
            <div class="lock-widget weather-widget" aria-label="Toronto weather">
              <div class="widget-app-label"><span class="widget-app-icon" id="weatherSymbol">☁</span><span>Weather</span></div>
              <div class="weather-main">
                <span class="weather-temperature" id="weatherTemperature">--°</span>
                <span class="weather-condition" id="weatherCondition">Loading</span>
              </div>
              <div class="weather-range" id="weatherRange">H --°  L --° · Toronto</div>
            </div>
            <div class="lock-widget reminder-widget" aria-label="Reminder: Update resume">
              <div class="widget-app-label"><span class="reminder-app-icon">☑</span><span>Reminders</span></div>
              <button class="reminder-task" id="reminderTask" type="button" aria-pressed="false">
                <span class="reminder-check" aria-hidden="true"></span>
                <span class="reminder-copy"><span class="reminder-title">Update resume</span><span class="reminder-subtitle">Today</span></span>
              </button>
            </div>
          </div>

          <div class="lock-bottom">
            <div class="lock-shortcuts">
              <button id="lockButton" class="round-control flashlight" type="button" aria-label="Unlock phone">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 5-2 2v8l-2 3-2-3v-8L8 8l1-5Z"/><path d="M9 8h6M10 12h4"/></svg>
              </button>
              <button id="languageButton" class="round-control camera" type="button" aria-label="Language options">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
              </button>
            </div>
            <p class="swipe-hint">Swipe up to open</p>
            <div class="swipe-pill"></div>
          </div>
          <div id="languagePopover" class="language-popover hidden">
            <button type="button">English <span>✓</span></button>
            <button type="button">Français</button>
          </div>
        </section>

        <section id="homeScreen" class="home-screen hidden">
          <div class="ios-status-bar">
            <span id="homeDate">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>

          <div class="home-widgets photography-widgets">
            <button class="home-widget photo-widget" data-app="photos" type="button" aria-label="Open selected work and photo portfolio">
            </button>
            <div class="home-widget calendar-widget" aria-label="Calendar date">
              <span class="calendar-weekday" id="homeCalendarWeekday">MON</span>
              <strong class="calendar-day" id="homeCalendarDay">09</strong>
              <span class="calendar-month" id="homeCalendarMonth">NOVEMBER</span>
              <div class="calendar-events" aria-label="Today's schedule">
                <span class="calendar-event"><span class="calendar-event-dot run-dot"></span><time>7:00 AM</time><strong>Morning run</strong></span>
                <span class="calendar-event"><span class="calendar-event-dot lesson-dot"></span><time>1:00 PM</time><strong>Japanese lesson</strong></span>
              </div>
            </div>
          </div>
          <div class="app-grid">
            <button class="app" data-app="notes"><span class="app-icon ios-notes" role="img" aria-label="Apple Notes app icon"><svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#fff"/><path d="M0 14A14 14 0 0 1 14 0h32a14 14 0 0 1 14 14v7H0z" fill="#ffd33d"/><path d="M0 20.5h60" stroke="#e9c12e" stroke-width="1"/><path d="M11 30h38M11 38h38M11 46h38" stroke="#d1d1d6" stroke-width="1.8" stroke-linecap="round"/></svg></span><span>Notes</span></button>
            <button class="app" data-app="files"><span class="app-icon ios-files" role="img" aria-label="Apple Files app icon"><svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#fff"/><defs><linearGradient id="fileBlueNew" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5ac8fa"/><stop offset="1" stop-color="#007aff"/></linearGradient></defs><path d="M8 18.5c0-2.5 2-4.5 4.5-4.5H25l5.2 5.2h17.3c2.5 0 4.5 2 4.5 4.5V42a5 5 0 0 1-5 5H13a5 5 0 0 1-5-5z" fill="#4bb7f7"/><path d="M8 25h44v17a5 5 0 0 1-5 5H13a5 5 0 0 1-5-5z" fill="url(#fileBlueNew)"/><path d="M8 25h44" stroke="#a7e5ff" stroke-width="1.2"/></svg></span><span>Files</span></button>
            <button class="app" data-app="safari"><span class="app-icon ios-safari" role="img" aria-label="Safari app icon"><svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="safariNew" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5ad9ff"/><stop offset="1" stop-color="#0878f9"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#safariNew)"/><circle cx="30" cy="30" r="23" fill="#fff"/><circle cx="30" cy="30" r="20" fill="#168fe8"/><circle cx="30" cy="30" r="18" fill="none" stroke="#c7eaff" stroke-width=".8"/><g stroke="#c7eaff" stroke-width=".8"><path d="M30 11v5M30 44v5M11 30h5M44 30h5M16.6 16.6l3.3 3.3M40.1 40.1l3.3 3.3M43.4 16.6l-3.3 3.3M19.9 40.1l-3.3 3.3"/></g><path d="M39.8 19.4 33 33l-12.8 7.6L27 27z" fill="#ff3b30"/><path d="M20.2 40.6 27 27l6 6z" fill="#fff"/><circle cx="30" cy="30" r="2" fill="#fff"/></svg></span><span>Safari</span></button>
          </div>
          <div class="dock">
            <button class="app" data-app="photos" aria-label="Open Photos">
              <span class="app-icon ios-photos" role="img" aria-label="Photos app icon"><svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#fff"/><g transform="translate(30 30)"><ellipse cx="0" cy="-12" rx="6.5" ry="13.5" fill="#ff3b30"/><ellipse cx="0" cy="-12" rx="6.5" ry="13.5" fill="#ff9f0a" transform="rotate(45)"/><ellipse cx="0" cy="-12" rx="6.5" ry="13.5" fill="#ffdf00" transform="rotate(90)"/><ellipse cx="0" cy="-12" rx="6.5" ry="13.5" fill="#9cdb39" transform="rotate(135)"/><ellipse cx="0" cy="-12" rx="6.5" ry="13.5" fill="#34c98c" transform="rotate(180)"/><ellipse cx="0" cy="-12" rx="6.5" ry="13.5" fill="#5aade4" transform="rotate(225)"/><ellipse cx="0" cy="-12" rx="6.5" ry="13.5" fill="#9b76c5" transform="rotate(270)"/><ellipse cx="0" cy="-12" rx="6.5" ry="13.5" fill="#df69a9" transform="rotate(315)"/><circle r="3.2" fill="#fff"/></g></svg>
              </span>
              <span>Photos</span>
            </button>
            <button class="app" data-app="linkedin" aria-label="Open LinkedIn">
              <span class="app-icon linkedin-icon" role="img" aria-label="LinkedIn app icon">
                <svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#0A66C2"/><path fill="#fff" d="M13.5 23h7.1v23h-7.1zm3.55-11a4.1 4.1 0 1 1 0 8.2 4.1 4.1 0 0 1 0-8.2zM25 23h6.8v3.15h.1c.95-1.8 3.28-3.7 6.75-3.7 7.22 0 8.55 4.75 8.55 10.93V46h-7.1V34.8c0-2.68-.05-6.12-3.73-6.12-3.73 0-4.3 2.91-4.3 5.92V46H25z"/></svg>
              </span>
              <span>LinkedIn</span>
            </button>
            <button class="app" data-app="spotify" aria-label="Open Spotify">
              <span class="app-icon ios-spotify" role="img" aria-label="Spotify app icon">
                <svg viewBox="0 0 60 60" aria-hidden="true" focusable="false"><rect width="60" height="60" rx="13" fill="#000"/><circle cx="30" cy="30" r="23.5" fill="#1ED760"/><path d="M15.8 23.4c10-3.1 21.5-2 29.5 3.4" fill="none" stroke="#000" stroke-width="4.4" stroke-linecap="round"/><path d="M17.5 31.2c8.5-2.5 18.2-1.6 25.1 3.1" fill="none" stroke="#000" stroke-width="3.8" stroke-linecap="round"/><path d="M19.5 38.7c7-2 14.7-1.2 20.2 2.5" fill="none" stroke="#000" stroke-width="3.3" stroke-linecap="round"/></svg>
              </span>
              <span>Spotify</span>
            </button>
            <button class="app" data-app="contact" aria-label="Open Contact">
              <span class="app-icon ios-contacts" role="img" aria-label="Contacts app icon"><svg viewBox="0 0 60 60" aria-hidden="true"><defs><clipPath id="contactsIconClip"><rect width="60" height="60" rx="14"/></clipPath></defs><g clip-path="url(#contactsIconClip)"><rect width="60" height="60" fill="#dcd9d0"/><rect x="52.5" y="0" width="7.5" height="15" fill="#b8b8b2"/><rect x="52.5" y="15" width="7.5" height="15" fill="#42b9e8"/><rect x="52.5" y="30" width="7.5" height="15" fill="#ff9b00"/><rect x="52.5" y="45" width="7.5" height="15" fill="#2cc755"/><rect x="0" y="0" width="52.5" height="60" fill="#dcd9d0"/><path d="M52.5 0h7.5v15h-7.5z" fill="#b8b8b2"/><circle cx="26.5" cy="29.5" r="18.5" fill="none" stroke="#aaa49d" stroke-width="1.7"/><circle cx="26.5" cy="25" r="6.5" fill="#aaa49d"/><path d="M12.4 42.2c2.4-8 8.1-12.1 14.1-12.1s11.7 4.1 14.1 12.1c-3.5 4-8.7 6.1-14.1 6.1s-10.6-2.1-14.1-6.1z" fill="#aaa49d"/></g></svg>
              </span>
              <span>Contact</span>
            </button>
          </div>
          <div class="home-page-indicator"></div>
        </section>

        <section id="appScreen" class="app-screen hidden">
          <div class="ios-status-bar app-status-bar">
            <span id="appStatusTime">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>
          <header class="app-header">
            <button id="backButton" type="button">‹ Back</button>
            <h2 id="appTitle">About</h2>
            <span class="header-spacer"></span>
          </header>
          <div id="appContent" class="app-content"></div>
          <div class="app-home-indicator"></div>
        </section>
      </div>
      <div id="assistiveTouch" class="assistive-touch hidden" aria-label="AssistiveTouch">
        <button id="assistiveTouchButton" class="assistive-touch-button" type="button" aria-label="Open AssistiveTouch">
          <span class="assistive-touch-ring"></span>
        </button>
        <div id="assistiveTouchMenu" class="assistive-touch-menu hidden" role="menu" aria-label="AssistiveTouch menu">
          <button id="assistiveHomeButton" type="button" role="menuitem" aria-label="Return to Home Screen">
            <span class="assistive-menu-icon" aria-hidden="true">⌂</span>
            <span>Home Screen</span>
          </button>
          <button id="assistiveLockButton" type="button" role="menuitem">
            <span class="assistive-menu-icon">⌑</span>
            <span>Lock Screen</span>
          </button>
        </div>
      </div>
      <div class="outer-home-indicator"></div>
    </div>
  </main>
  <script src="app.js?v=spotify-owner-controls-20261111"></script>
</body>
</html>
