<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>iPhone Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="phone" id="phone" aria-label="Interactive iPhone resume">
      <div class="screen">
        <div class="wallpaper" aria-hidden="true"></div>
        <div class="dynamic-island" aria-hidden="true"><span class="camera-dot"></span></div>

        <section id="lockScreen" class="lock-screen">
          <div class="ios-status-bar">
            <span id="statusTime">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>

          <div class="lock-content">
            <div class="lock-date" id="lockDate">Monday, November 7</div>
            <div class="lock-clock" id="lockClock">9:41</div>
          </div>

          <div class="lock-widgets" aria-label="Lock Screen widgets">
            <div class="lock-widget weather-widget" aria-label="Toronto weather">
              <div class="widget-app-label"><span class="widget-app-icon" id="weatherSymbol">☁</span><span>Weather</span></div>
              <div class="weather-main">
                <span class="weather-temperature" id="weatherTemperature">--°</span>
                <span class="weather-condition" id="weatherCondition">Loading</span>
              </div>
              <div class="weather-range" id="weatherRange">H --°  L --° · Toronto</div>
            </div>
            <div class="lock-widget reminder-widget" aria-label="Reminder: Update resume">
              <div class="widget-app-label"><span class="reminder-app-icon">☑</span><span>Reminders</span></div>
              <button class="reminder-task" id="reminderTask" type="button" aria-pressed="false">
                <span class="reminder-check" aria-hidden="true"></span>
                <span class="reminder-copy"><span class="reminder-title">Update resume</span><span class="reminder-subtitle">Today</span></span>
              </button>
            </div>
          </div>

          <div class="lock-bottom">
            <div class="lock-shortcuts">
              <button id="lockButton" class="round-control flashlight" type="button" aria-label="Unlock phone">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 5-2 2v8l-2 3-2-3v-8L8 8l1-5Z"/><path d="M9 8h6M10 12h4"/></svg>
              </button>
              <button id="languageButton" class="round-control camera" type="button" aria-label="Language options">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
              </button>
            </div>
            <p class="swipe-hint">Swipe up to open</p>
            <div class="swipe-pill"></div>
          </div>
          <div id="languagePopover" class="language-popover hidden">
            <button type="button">English <span>✓</span></button>
            <button type="button">Français</button>
          </div>
        </section>

        <section id="homeScreen" class="home-screen hidden">
          <div class="ios-status-bar">
            <span id="homeDate">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>

          <div class="app-grid">
            <button class="app" data-app="about"><span class="app-icon contacts"><svg viewBox="0 0 60 60"><rect x="7" y="7" width="46" height="46" rx="11" fill="#f8f8fa"/><circle cx="30" cy="23" r="9" fill="#e4a17f"/><path d="M13 49c2-11 9-16 17-16s15 5 17 16" fill="#4386c8"/></svg></span><span>About</span></button>
            <button class="app" data-app="experience"><span class="app-icon work-icon"><svg viewBox="0 0 60 60"><rect x="10" y="17" width="40" height="31" rx="5" fill="#fff"/><path d="M22 17v-4h16v4M10 28h40M25 27v5h10v-5" fill="none" stroke="#2384d8" stroke-width="3" stroke-linecap="round"/></svg></span><span>Experience</span></button>
            <button class="app" data-app="skills"><span class="app-icon settings-icon"><svg viewBox="0 0 60 60"><path d="m26 9 8 0 2 6 5 2 6-2 5 7-4 5v6l4 5-5 7-6-2-5 2-2 6h-8l-2-6-5-2-6 2-5-7 4-5v-6l-4-5 5-7 6 2 5-2z" fill="#fff"/><circle cx="30" cy="30" r="8" fill="#929ba8"/></svg></span><span>Skills</span></button>
            <button class="app" data-app="campaigns"><span class="app-icon photos-icon"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="8" fill="#ffcf4a"/><g fill="#f45e85"><ellipse cx="30" cy="15" rx="6" ry="10"/><ellipse cx="30" cy="45" rx="6" ry="10"/><ellipse cx="15" cy="30" rx="10" ry="6"/><ellipse cx="45" cy="30" rx="10" ry="6"/><ellipse cx="19" cy="19" rx="6" ry="10" transform="rotate(-45 19 19)"/><ellipse cx="41" cy="41" rx="6" ry="10" transform="rotate(-45 41 41)"/></g></svg></span><span>Campaigns</span></button>
            <button class="app" data-app="education"><span class="app-icon education-icon"><svg viewBox="0 0 60 60"><path d="m7 23 23-12 23 12-23 12z" fill="#fff"/><path d="M17 29v12c8 7 18 7 26 0V29l-13 7z" fill="#e5fff4"/><path d="M52 24v15" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span><span>Education</span></button>
            <button class="app" data-app="resume"><span class="app-icon files-icon"><svg viewBox="0 0 60 60"><path d="M17 9h19l9 9v33H17z" fill="#fff"/><path d="M36 9v10h9M23 29h16M23 35h16M23 41h11" fill="none" stroke="#4b91d9" stroke-width="2.5" stroke-linecap="round"/></svg></span><span>Resume</span></button>
          </div>

          <div class="dock">
            <button class="app" data-app="contact"><span class="app-icon messages-icon"><svg viewBox="0 0 60 60"><path d="M12 15h36a5 5 0 0 1 5 5v20a5 5 0 0 1-5 5H25L13 53v-8h-1a5 5 0 0 1-5-5V20a5 5 0 0 1 5-5Z" fill="#fff"/><path d="M17 28h26M17 35h18" stroke="#37b95c" stroke-width="3" stroke-linecap="round"/></svg></span><span>Contact</span></button>
            <button class="app" data-app="linkedin"><span class="app-icon linkedin-icon"><span class="linkedin-mark">in</span></span><span>LinkedIn</span></button>
            <button class="app" data-app="email"><span class="app-icon mail-icon"><svg viewBox="0 0 60 60"><rect x="8" y="14" width="44" height="32" rx="7" fill="#fff"/><path d="m10 18 20 16 20-16" fill="none" stroke="#4b9be9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Email</span></button>
            <button class="app" data-app="resume"><span class="app-icon files-icon"><svg viewBox="0 0 60 60"><path d="M17 9h19l9 9v33H17z" fill="#fff"/><path d="M36 9v10h9M23 29h16M23 35h16M23 41h11" fill="none" stroke="#4b91d9" stroke-width="2.5" stroke-linecap="round"/></svg></span><span>Resume</span></button>
          </div>
          <div class="home-page-indicator"></div>
        </section>

        <section id="appScreen" class="app-screen hidden">
          <div class="ios-status-bar app-status-bar">
            <span id="appStatusTime">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>
          <header class="app-header">
            <button id="backButton" type="button">‹ Back</button>
            <h2 id="appTitle">About</h2>
            <span class="header-spacer"></span>
          </header>
          <div id="appContent" class="app-content"></div>
          <div class="app-home-indicator"></div>
        </section>
      </div>
      <div class="outer-home-indicator"></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
