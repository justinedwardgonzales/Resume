<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>iPhone Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="phone" id="phone" aria-label="Interactive iPhone resume">
      <div class="screen">
        <div class="wallpaper" aria-hidden="true"></div>
        <div class="dynamic-island" aria-hidden="true"><span class="camera-dot"></span></div>

        <section id="lockScreen" class="lock-screen">
          <div class="ios-status-bar">
            <span id="statusTime">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>

          <div class="lock-content">
            <div class="lock-date" id="lockDate">Monday, November 7</div>
            <div class="lock-clock" id="lockClock">9:41</div>
          </div>

          <div class="lock-widgets" aria-label="Lock Screen widgets">
            <div class="lock-widget weather-widget" aria-label="Toronto weather">
              <div class="widget-app-label"><span class="widget-app-icon" id="weatherSymbol">☁</span><span>Weather</span></div>
              <div class="weather-main">
                <span class="weather-temperature" id="weatherTemperature">--°</span>
                <span class="weather-condition" id="weatherCondition">Loading</span>
              </div>
              <div class="weather-range" id="weatherRange">H --°  L --° · Toronto</div>
            </div>
            <div class="lock-widget reminder-widget" aria-label="Reminder: Update resume">
              <div class="widget-app-label"><span class="reminder-app-icon">☑</span><span>Reminders</span></div>
              <button class="reminder-task" id="reminderTask" type="button" aria-pressed="false">
                <span class="reminder-check" aria-hidden="true"></span>
                <span class="reminder-copy"><span class="reminder-title">Update resume</span><span class="reminder-subtitle">Today</span></span>
              </button>
            </div>
          </div>

          <div class="lock-bottom">
            <div class="lock-shortcuts">
              <button id="lockButton" class="round-control flashlight" type="button" aria-label="Unlock phone">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 5-2 2v8l-2 3-2-3v-8L8 8l1-5Z"/><path d="M9 8h6M10 12h4"/></svg>
              </button>
              <button id="languageButton" class="round-control camera" type="button" aria-label="Language options">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h4l1.5-2h5L16 8h4v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
              </button>
            </div>
            <p class="swipe-hint">Swipe up to open</p>
            <div class="swipe-pill"></div>
          </div>
          <div id="languagePopover" class="language-popover hidden">
            <button type="button">English <span>✓</span></button>
            <button type="button">Français</button>
          </div>
        </section>

        <section id="homeScreen" class="home-screen hidden">
          <div class="ios-status-bar">
            <span id="homeDate">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>

          <div class="home-widgets personal-widgets">
            <button class="home-widget widget-streak" id="streakWidget" type="button" aria-label="Check in for your curiosity streak">
              <span class="widget-kicker">CURIOSITY STREAK</span>
              <span class="streak-count"><strong id="streakCount">0</strong><small>days</small></span>
              <span class="widget-foot"><span id="streakMessage">Tap to start a streak</span><span>🔥</span></span>
            </button>
          </div>
          <div class="app-grid">
            <button class="app" data-app="notes"><span class="app-icon ios-notes" role="img" aria-label="Apple Notes app icon"><svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="17" fill="#fff"/><path d="M0 17a17 17 0 0 1 17-17h26a17 17 0 0 1 17 17v2H0z" fill="#ffd83d"/><path d="M12 29h36M12 37h36M12 45h29" stroke="#c7c7cc" stroke-width="2.2" stroke-linecap="round"/></svg></span><span>Notes</span></button>
            <button class="app" data-app="photos"><span class="app-icon ios-photos" role="img" aria-label="Apple Photos app icon"><svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="17" fill="#fff"/><g transform="translate(30 30)"><ellipse cx="0" cy="-10.5" rx="7.3" ry="12" fill="#ff9f0a"/><ellipse cx="0" cy="-10.5" rx="7.3" ry="12" transform="rotate(45)" fill="#ff453a"/><ellipse cx="0" cy="-10.5" rx="7.3" ry="12" transform="rotate(90)" fill="#bf5af2"/><ellipse cx="0" cy="-10.5" rx="7.3" ry="12" transform="rotate(135)" fill="#0a84ff"/><ellipse cx="0" cy="-10.5" rx="7.3" ry="12" transform="rotate(180)" fill="#30d158"/><ellipse cx="0" cy="-10.5" rx="7.3" ry="12" transform="rotate(225)" fill="#a8e10c"/><ellipse cx="0" cy="-10.5" rx="7.3" ry="12" transform="rotate(270)" fill="#ffd60a"/><ellipse cx="0" cy="-10.5" rx="7.3" ry="12" transform="rotate(315)" fill="#ff375f"/></g><circle cx="30" cy="30" r="5.1" fill="#fff"/></svg></span><span>Photos</span></button>
          </div>
          <div class="dock">
            <button class="app" data-app="contact"><span class="app-icon ios-contacts" role="img" aria-label="Apple Contacts app icon"><svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="contactBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce7e8"/><stop offset="1" stop-color="#a8c2ca"/></linearGradient></defs><rect width="60" height="60" rx="17" fill="url(#contactBg)"/><rect x="12" y="7" width="36" height="46" rx="5" fill="#fff" opacity=".97"/><circle cx="30" cy="23" r="8" fill="#a7b6bc"/><path d="M16 48c1.4-9 6.8-13.5 14-13.5S42.6 39 44 48" fill="#a7b6bc"/><path d="M12 16h-4m4 9h-4m4 9h-4m40-18h4m-4 9h4m-4 9h4" stroke="#7f9ca6" stroke-width="3" stroke-linecap="round"/></svg></span><span>Contact</span></button>
            <button class="app" data-app="linkedin"><span class="app-icon linkedin-icon"><img class="brand-icon linkedin-brand" src="https://cdn.simpleicons.org/linkedin/0A66C2" alt=""></span><span>LinkedIn</span></button>
            <button class="app" data-app="spotify"><span class="app-icon ios-spotify"><img class="brand-icon spotify-brand" src="https://cdn.simpleicons.org/spotify/FFFFFF" alt=""></span><span>Spotify</span></button>
            <button class="app" data-app="files"><span class="app-icon ios-files"><svg viewBox="0 0 60 60"><rect width="60" height="60" rx="15" fill="#fff"/><path d="M10 19a5 5 0 0 1 5-5h13l5 5h12a5 5 0 0 1 5 5v20a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5z" fill="#1687e5"/></svg></span><span>Files</span></button>
          </div>
          <div class="home-page-indicator"></div>
        </section>

        <section id="appScreen" class="app-screen hidden">
          <div class="ios-status-bar app-status-bar">
            <span id="appStatusTime">9:41</span>
            <span class="status-icons" aria-label="Cellular, Wi-Fi and battery">
              <svg viewBox="0 0 78 18" aria-hidden="true">
                <path class="signal" d="M2 15V11M7 15V8M12 15V5M17 15V2"/>
                <path class="wifi" d="M27 6c5-5 12-5 17 0M30 9c3-3 8-3 11 0M34 12c1-1 2-1 3 0"/>
                <rect class="battery-outline" x="52" y="3" width="20" height="11" rx="3"/>
                <path class="battery-cap" d="M74 6v5"/>
                <rect class="battery-fill" x="54" y="5" width="15" height="7" rx="1.5"/>
              </svg>
            </span>
          </div>
          <header class="app-header">
            <button id="backButton" type="button">‹ Back</button>
            <h2 id="appTitle">About</h2>
            <span class="header-spacer"></span>
          </header>
          <div id="appContent" class="app-content"></div>
          <div class="app-home-indicator"></div>
        </section>
      </div>
      <div id="assistiveTouch" class="assistive-touch hidden" aria-label="AssistiveTouch">
        <button id="assistiveTouchButton" class="assistive-touch-button" type="button" aria-label="Open AssistiveTouch">
          <span class="assistive-touch-ring"></span>
        </button>
        <div id="assistiveTouchMenu" class="assistive-touch-menu hidden" role="menu" aria-label="AssistiveTouch menu">
          <button id="assistiveLockButton" type="button" role="menuitem">
            <span class="assistive-menu-icon">⌑</span>
            <span>Lock Screen</span>
          </button>
        </div>
      </div>
      <div class="outer-home-indicator"></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
