<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Interactive Resume</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage">
    <div class="phone">
      <div class="screen">

        <div class="dynamic-island"></div>

        <!-- Lock Screen -->
        <section id="lockScreen" class="lock-screen">
          <div class="status-bar">9:41</div>
          <div class="lock-date">Monday, November 7</div>
          <div class="lock-clock" id="clock">9:41</div>

          <div class="lock-profile">
            <div class="avatar">JG</div>
            <h1>Your Name</h1>
            <p>Senior Media Planner</p>
            <p>Publicis</p>
          </div>

          <div class="unlock-area">
            <p>Swipe up to unlock</p>
            <div class="swipe-pill"></div>
          </div>
        </section>

        <!-- Home Screen -->
        <section id="homeScreen" class="home-screen hidden">
          <div class="home-date">My Professional World</div>

          <div class="app-grid">
            <button class="app" onclick="openApp('about')">
              <span class="app-icon purple">👤</span>
              <span>About</span>
            </button>

            <button class="app" onclick="openApp('work')">
              <span class="app-icon blue">💼</span>
              <span>Experience</span>
            </button>

            <button class="app" onclick="openApp('skills')">
              <span class="app-icon orange">📊</span>
              <span>Skills</span>
            </button>

            <button class="app" onclick="openApp('photos')">
              <span class="app-icon pink">📸</span>
              <span>Campaigns</span>
            </button>

            <button class="app" onclick="openApp('education')">
              <span class="app-icon green">🎓</span>
              <span>Education</span>
            </button>

            <button class="app" onclick="openApp('resume')">
              <span class="app-icon red">📄</span>
              <span>Resume</span>
            </button>

            <button class="app" onclick="openApp('messages')">
              <span class="app-icon green">💬</span>
              <span>Contact</span>
            </button>

            <button class="app" onclick="openLinkedIn()">
              <span class="app-icon blue">in</span>
              <span>LinkedIn</span>
            </button>
          </div>

          <div class="dock">
            <button class="app" onclick="emailMe()">
              <span class="app-icon green">✉️</span>
              <span>Email</span>
            </button>
          </div>
        </section>

        <!-- App Window -->
        <section id="appScreen" class="app-screen hidden">
          <header class="app-header">
            <button onclick="closeApp()">‹ Back</button>
            <h2 id="appTitle">About</h2>
          </header>
          <div id="appContent" class="app-content"></div>
        </section>

      </div>
      <div class="home-indicator"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
